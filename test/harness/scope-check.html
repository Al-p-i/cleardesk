<!doctype html><meta charset="utf-8"><title>scope check</title>
<div class="workspace-leaf-content" data-type="file-explorer"><div class="nav-files-container">
 <div class="tree-item nav-folder mod-root"><div class="tree-item-self nav-folder-title" data-path="/"></div><div class="tree-item-children">
  <div class="tree-item nav-folder" id="personal"><div class="tree-item-self nav-folder-title" data-path="Personal">Personal</div>
    <div class="tree-item-children"><div class="tree-item nav-file" id="pnote"><div class="tree-item-self nav-file-title" data-path="Personal/note.md">note</div></div></div></div>
  <div class="tree-item nav-folder" id="apt"><div class="tree-item-self nav-folder-title" data-path="APARTMENTS">APARTMENTS</div>
    <div class="tree-item-children">
      <div class="tree-item nav-file" id="pdf"><div class="tree-item-self nav-file-title" data-path="APARTMENTS/lease.pdf">lease.pdf</div></div>
      <div class="tree-item nav-folder" id="att"><div class="tree-item-self nav-folder-title" data-path="APARTMENTS/Attachments">Attachments</div>
        <div class="tree-item-children"><div class="tree-item nav-file" id="img"><div class="tree-item-self nav-file-title" data-path="APARTMENTS/Attachments/a.png">a.png</div></div></div></div>
    </div></div>
  <div class="tree-item nav-folder" id="apt2"><div class="tree-item-self nav-folder-title" data-path="APARTMENTS 2">APARTMENTS 2 (similar name)</div></div>
  <div class="tree-item nav-file" id="rootfile"><div class="tree-item-self nav-file-title" data-path="todo.md">todo.md</div></div>
 </div></div>
</div></div>
<pre id="out"></pre>
<script>"use strict";

<script>
document.head.appendChild(Object.assign(document.createElement("style"), { textContent: Scope.explorerScopeCss("APARTMENTS") }));
const vis = (id) => getComputedStyle(document.getElementById(id)).display !== "none" && document.getElementById(id).offsetParent !== null;
const expect = { personal: false, pnote: false, apt: true, pdf: true, att: true, img: true, apt2: false, rootfile: false };
const res = Object.entries(expect).map(([id, want]) => `${vis(id) === want ? "ok  " : "FAIL"} ${id}: ${vis(id) ? "visible" : "hidden"}`);
document.getElementById("out").textContent = res.join("\n");
document.title = res.some((r) => r.startsWith("FAIL")) ? "FAIL" : "ALL OK";
</script>
